<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Evan Hendra, offensive security</title>
  <desc id="desc">32 accepted bug bounty findings, 11 of them CVEs in Keycloak. A proof-of-concept run shows VULNERABLE on the affected version and FIXED on the patched one.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#e6e9ed"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="1"/></linearGradient>
    <style>
      .sans { font-family: Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="360" rx="14" fill="#ffffff"/>
  <rect width="1280" height="360" rx="14" fill="url(#dots)"/>
  <rect x="380" width="900" height="360" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="14" fill="none" stroke="#d0d7de"/>

  <!-- identity -->
  <rect x="72" y="92" width="10" height="10" fill="#cf222e"/>
  <text x="94" y="102" class="mono" font-size="16" letter-spacing="3.5" fill="#59636e">OFFENSIVE SECURITY</text>
  <text x="68" y="184" class="sans" font-size="76" font-weight="700" letter-spacing="-2" fill="#1f2328">Evan Hendra</text>

  <text x="72" y="268" class="mono" font-size="44" font-weight="700" fill="#1f2328">32</text>
  <text x="72" y="296" class="mono" font-size="15" fill="#59636e">accepted findings</text>
  <line x1="262" y1="232" x2="262" y2="300" stroke="#d0d7de"/>
  <text x="292" y="268" class="mono" font-size="44" font-weight="700" fill="#1f2328">11</text>
  <text x="292" y="296" class="mono" font-size="15" fill="#59636e">CVEs in Keycloak</text>

  <!-- proof-of-concept run -->
  <g transform="translate(700 56)">
    <rect width="508" height="248" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <line x1="0" y1="40" x2="508" y2="40" stroke="#d0d7de"/>
    <text x="20" y="26" class="mono" font-size="13" fill="#59636e">poc/CVE-2026-4636.sh</text>
    <text x="488" y="26" class="mono" font-size="13" text-anchor="end" fill="#59636e">CVSS 8.1</text>

    <g class="mono" font-size="15">
      <text x="20" y="74" fill="#59636e">$ <tspan fill="#1f2328">./CVE-2026-4636.sh 26.5.5</tspan></text>
      <text x="20" y="100" fill="#59636e">[+] version: Keycloak 26.5.5</text>
      <rect x="20" y="112" width="206" height="28" rx="5" fill="#ffebe9"/>
      <text x="32" y="131" font-weight="700" fill="#cf222e">VERDICT  VULNERABLE</text>

      <text x="20" y="172" fill="#59636e">$ <tspan fill="#1f2328">./CVE-2026-4636.sh 26.5.7</tspan></text>
      <text x="20" y="198" fill="#59636e">[+] version: Keycloak 26.5.7</text>
      <rect x="20" y="208" width="152" height="28" rx="5" fill="#dafbe1"/>
      <text x="32" y="227" font-weight="700" fill="#1a7f37">VERDICT  FIXED</text>
      <rect class="cursor" x="184" y="213" width="9" height="18" fill="#1f2328"/>
    </g>
  </g>
</svg>
